name: test-minimal-deps

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      python:
        required: true
        type: string
      codeCovPython:
        required: true
        type: string

jobs:
  minimal-deps:
    # This job installs minimal dependencies and runs tests for the minimal
    # dependency cases. This also covers the case where matplotlib is not
    # installed, i.e., fairlearn without extras.
    # CodeCov limits us to 150 uploads per commit id, so have an extra check so
    # we only upload results if the current commit is under 48 hours old
    runs-on: ${{ inputs.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Get commit date
        id: get_date
        shell: bash
        run: |
          COMMIT_DATE=$(git show -s --format=%ct ${{ github.sha }})
          CURRENT_DATE=$(date +%s)
          AGE=$((CURRENT_DATE - COMMIT_DATE))
          echo "AGE=$AGE" >> $GITHUB_OUTPUT
          echo "AGE in seconds: $AGE"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ inputs.python }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv venv --python python .venv-compat
      - run: uv pip install --python .venv-compat . pytest pytest-cov --prerelease disallow
      - name: Verify optional plotting dependencies are absent
        run: uv run --no-project --python .venv-compat python -c "from importlib.util import find_spec; assert find_spec('matplotlib') is None"
      - run: uv run --no-project --python .venv-compat python -m pytest --cov=fairlearn --cov-report=xml test/install
      - name: Upload coverage reports to Codecov with GitHub Action
        if: ${{ (inputs.codeCovPython == inputs.python) && (steps.get_date.outputs.AGE < 172800) }} # 172800 = 48 * 3600
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          env_vars: OS,PYTHON
          fail_ci_if_error: true
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          verbose: true
