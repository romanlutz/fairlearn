name: OpenML tests

permissions:
  contents: read

on:
  push:
    branches:
      - "main"
  pull_request:
    branches:
      - "main"
      - "release/**"
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

concurrency:
  group: openml-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  DATA_HOME: "~/openml_data"

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv sync --locked --python python
      - name: Get scikit-learn version
        id: sklearn-version
        run: uv run --locked --python python python -c "import sklearn; print('version=' + sklearn.__version__)" >> "$GITHUB_OUTPUT"
      - name: Cache OpenML datasets
        id: openml-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.DATA_HOME }}
          key: ${{ runner.os }}-openml-datasets-v2-sklearn-${{ steps.sklearn-version.outputs.version }}-${{ hashFiles('fairlearn/datasets/_fetch_*.py', 'test/unit/datasets/test_datasets.py', 'test/unit/adversarial/test_preprocessing.py', 'test/unit/preprocessing/test_preprocessing_fairness.py', 'test/unit/test_random_state.py') }}
          restore-keys: |
            ${{ runner.os }}-openml-datasets-v2-sklearn-${{ steps.sklearn-version.outputs.version }}-
      - name: Report OpenML cache result
        run: echo "Exact cache hit ${{ steps.openml-cache.outputs.cache-hit }}"
      - run: >
          uv run --locked --python python python -m pytest
          -W "default:A network error occurred while downloading:UserWarning"
          -W "default:Invalid cache, redownloading file:RuntimeWarning"
          -m openml -vl test/
