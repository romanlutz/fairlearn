name: test-other-ml

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      python:
        required: true
        type: string
      mlpackage:
        required: true
        type: string

jobs:
  other-ml:
    runs-on: ${{ inputs.os }}
    defaults:
      run:
        shell: bash -el {0}
    env:
      baseDir: test_othermlpackages
      condaEnv: test-conda-env
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ inputs.python }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Set up Conda environment
        uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4
        with:
          miniconda-version: latest
          activate-environment: ${{ env.condaEnv }}
          # Let each environment file choose its compatible Python version.
          environment-file: ${{ env.baseDir }}/conda-${{ inputs.mlpackage }}.yaml
          auto-activate: false
      - run: |
          if [[ ${{ inputs.mlpackage }} == "tensorflow" ]]; then
            export NUMPY_DEP="numpy<2"
          else
            export NUMPY_DEP="numpy"
          fi
          if [[ ${{ inputs.mlpackage }} == "lightgbm" ]]; then
            export NUMPY_DEP="numpy<2"
          else
            export NUMPY_DEP="numpy"
          fi
          uv pip install --system --python "$CONDA_PREFIX/bin/python" . $NUMPY_DEP
        name: Install Fairlearn
      - run: |
          echo
          conda list
          echo
          # Override the filterwarnings set in the TOML file
          python -v -m pytest -o filterwarnings=default --cov=fairlearn --cov-report=xml $baseDir/test_${{inputs.mlpackage}}.py
        name: Run ${{ inputs.mlpackage }} tests
      - name: Retain coverage report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-line-other-${{ inputs.mlpackage }}-${{ inputs.os }}-${{ inputs.python }}
          path: |
            .coverage
            coverage.xml
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
