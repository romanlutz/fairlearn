name: test-all-deps

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      python:
        required: true
        type: string
      codeCovPython:
        required: true
        type: string
      sklearnNightly:
        required: false
        type: boolean
        default: false
      coverageBranch:
        required: false
        type: boolean
        default: false

jobs:
  all-deps:
    # This job installs all dependencies and runs most tests.
    runs-on: ${{ inputs.os }}
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ inputs.python }}
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - run: uv venv --python python .venv-compat
      - run: uv pip install --python .venv-compat . --group tests --prerelease disallow
      - name: Install scikit-learn nightly build
        if: ${{ inputs.sklearnNightly }}
        run: >
          uv pip install --python .venv-compat --upgrade --prerelease allow --index
          https://pypi.anaconda.org/scientific-python-nightly-wheels/simple
          --index-strategy unsafe-best-match
          scikit-learn
      - if: ${{ inputs.sklearnNightly }}
        run: uv run --no-project --python .venv-compat python -c "import sklearn; assert '.dev' in sklearn.__version__, sklearn.__version__"
      - run: >
          uv run --no-project --python .venv-compat python -m pytest --mpl
          --mpl-baseline-path='${{ github.workspace }}/test/unit/plot_snapshots'
          --ignore=test/install -m "not openml"
          --cov=fairlearn ${{ inputs.coverageBranch && '--cov-branch' || '' }}
          --cov-report=xml --cov-report=json --cov-report=term -vl test/
      - name: Retain coverage report
        if: ${{ inputs.codeCovPython == inputs.python }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-${{ inputs.coverageBranch && 'branch' || 'line' }}-full-${{ inputs.os }}-${{ inputs.python }}
          path: |
            .coverage
            coverage.xml
            coverage.json
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
